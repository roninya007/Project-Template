name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore src/api.tests/Api.Tests.csproj

      - name: Build
        run: dotnet build src/api.tests/Api.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test src/api.tests/Api.Tests.csproj --no-build --configuration Release --verbosity normal
